{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f29">
  <title>Password updated | KERMS.CO.KE</title>
  <link rel="stylesheet" href="{% static 'css/public-home.css' %}?v=1">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=5">
</head>
<body class="auth-page">
  <header class="site-header auth-header">
    <a class="site-brand" href="{% url 'home' %}" aria-label="KERMS.CO.KE home">
      <span class="site-brand-mark" aria-hidden="true">K</span>
      <span class="site-brand-name">KERMS<small>.CO.KE</small><span class="site-brand-caption">Kenya Enterprise Risk Management System</span></span>
    </a>
  </header>
  <main class="auth-main" id="main-content">
    <section class="auth-card" aria-labelledby="reset-complete-title">
      <span class="auth-kicker">Password help</span>
      <h1 id="reset-complete-title">Your password is updated.</h1>
      <p class="auth-intro">You can now sign in with your new password.</p>
      <a class="auth-submit" href="{% url 'login' %}">Sign in <span aria-hidden="true">→</span></a>
    </section>
  </main>
</body>
</html>
